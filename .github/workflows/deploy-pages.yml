name: Deploy Pages

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the checked Pages artifact
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # An older Build can finish after a newer one. Never move Pages backwards
      # by publishing a completed run that no longer represents main.
      - name: Confirm this is the current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$EXPECTED_SHA" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
            printf 'Skipping stale Build revision.\n'
          fi

      - name: Download the exact checked site
        if: steps.revision.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: solar-system-pages
          path: pages-site
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify source provenance before publishing
        if: steps.revision.outputs.current == 'true'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('pages-site/wasm')
          manifest = json.loads((root / 'build-info.json').read_text())
          assert manifest['revision'] == os.environ['EXPECTED_SHA'], 'WASM/source revision mismatch'
          for name in ('solar-system-simulator.js', 'solar-system-simulator.wasm', 'catalog-orbits.wasm', 'learning-lab.mjs', 'learning-lab.wasm'):
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == manifest['files'][name], name
          PY

      - name: Package checked files for Pages
        if: steps.revision.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
