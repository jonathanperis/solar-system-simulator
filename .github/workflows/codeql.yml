name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install native build dependencies
        if: matrix.language == 'c-cpp'
        run: |
          # Stalled Ubuntu mirrors have held this step until the 30-minute job
          # timeout. A trickling transfer never trips apt's own timeout, so cap
          # each update attempt at four minutes and retry three times.
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "60"; Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get update; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "apt-get update attempt $attempt timed out or failed; retrying"
          done
          sudo apt-get install -y build-essential cmake git libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev mesa-common-dev pkg-config
      - name: Build or restore pinned raylib
        if: matrix.language == 'c-cpp'
        uses: ./.github/actions/raylib
        with:
          platform: native
      # Vendored third-party code (src/render/third_party/stb_image.h) is not
      # ours to triage. For C/C++ built in manual mode, paths-ignore has no
      # effect, so compile the one object that includes it before CodeQL
      # starts tracing; the traced make below reuses it and never sees stb.
      - name: Pre-build vendored third-party object outside analysis
        if: matrix.language == 'c-cpp'
        run: make build/src/render/image_decode.o
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'c-cpp' && 'manual' || 'none' }}
          queries: security-and-quality
      - name: Build native source for analysis
        if: matrix.language == 'c-cpp'
        env:
          RAYLIB_LIBS: -L/usr/local/lib -lraylib -lm -ldl -lpthread -lGL -lrt -lX11 -lXrandr -lXi -lXinerama -lXcursor
        run: make all headless analysis-web-boundary
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
