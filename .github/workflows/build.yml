name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native C/raylib build and tests
    runs-on: ubuntu-latest
    env:
      RAYLIB_LIBS: -lraylib -lm -ldl -lpthread -lGL -lrt -lX11 -lXrandr -lXi -lXinerama -lXcursor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install compiler and raylib system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libasound2-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-common-dev \
            pkg-config

      - name: Build and install raylib
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build /tmp/raylib/build --parallel
          sudo cmake --install /tmp/raylib/build
          sudo ldconfig

      - name: Build simulator
        run: make clean && make

      - name: Run C test suite
        run: make test

  wasm:
    name: WebAssembly artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58

      - name: Build raylib for WebAssembly
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
          make PLATFORM=PLATFORM_WEB -C /tmp/raylib/src

      - name: Build and smoke-check WebAssembly bundle
        run: make web RAYLIB_WEB_SRC=/tmp/raylib/src

      - name: Package WebAssembly artifact
        run: make dist-wasm RAYLIB_WEB_SRC=/tmp/raylib/src

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-system-simulator-wasm
          path: |
            build/web/solar-system-simulator.html
            build/web/solar-system-simulator.js
            build/web/solar-system-simulator.wasm
            build/solar-system-simulator-wasm.zip

  docs:
    name: Astro docs and Pages artifact checks
    needs: [native, wasm]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download WebAssembly artifact
        uses: actions/download-artifact@v4
        with:
          name: solar-system-simulator-wasm
          path: docs/public/wasm

      - name: Prepare WebAssembly public assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path('docs/public/wasm')
          for source in list(target.rglob('solar-system-simulator.*')):
              destination = target / source.name
              if source.resolve() != destination.resolve():
                  destination.write_bytes(source.read_bytes())
          PY
          rm -f docs/public/wasm/solar-system-simulator-wasm.zip
          python3 tools/check_wasm_artifacts.py docs/public/wasm

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs site
        working-directory: docs
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Type-check docs source
        working-directory: docs
        run: npm run check

      - name: Smoke-check docs routes and assets
        run: python3 tools/check_docs_routes.py docs/dist
