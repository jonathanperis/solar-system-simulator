name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REVISION: ${{ github.sha }}
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  native:
    name: Native C/raylib build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAYLIB_LIBS: -L/usr/local/lib -lraylib -lm -ldl -lpthread -lGL -lrt -lX11 -lXrandr -lXi -lXinerama -lXcursor

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install compiler and raylib system dependencies
        run: |
          # Stalled Ubuntu mirrors have held this step until the 30-minute job
          # timeout. A trickling transfer never trips apt's own timeout, so cap
          # each update attempt at four minutes and retry three times.
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "60"; Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get update; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "apt-get update attempt $attempt timed out or failed; retrying"
          done
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libasound2-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-common-dev \
            pkg-config

      - name: Build or restore pinned raylib
        uses: ./.github/actions/raylib
        with:
          platform: native

      - name: Build simulator
        run: make clean && make

      - name: Run C test suite
        run: make test

      - name: Verify headless CLI, build graph, and artifact failure contracts
        run: make test-build test-cli test-validators

      - name: Check address and undefined behavior sanitizers
        run: make test-sanitize

  macos:
    # Jonathan develops on macOS. This job builds the native app and runs the
    # C suite there, then renders Earth offscreen with the real GLSL 330
    # shader (CGL, no window) and checks the pixels; Linux CI only compiles
    # the shader text. Not a required check: it adds coverage, not a gate.
    name: macOS native build, tests and shader render
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RAYLIB_CFLAGS: -I/usr/local/include
      RAYLIB_LIBS: -L/usr/local/lib -lraylib -framework OpenGL -framework Cocoa -framework IOKit -framework CoreVideo -framework CoreAudio -framework CoreFoundation

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build or restore pinned raylib
        uses: ./.github/actions/raylib
        with:
          platform: native

      - name: Build simulator
        run: make clean && make

      - name: Run C test suite
        run: make test

      - name: Render with the native shader and check the pixels
        run: make test-native-shaders

  wasm:
    name: WebAssembly artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One Emscripten version for both the SDK and the cached raylib build.
      # renovate: datasource=github-tags depName=emscripten-core/emsdk
      EMSDK_VERSION: 6.0.9

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build or restore pinned raylib for WebAssembly
        id: raylib
        uses: ./.github/actions/raylib
        with:
          platform: web
          toolchain-key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Build and smoke-check WebAssembly bundle
        run: make web RAYLIB_WEB_SRC=${{ steps.raylib.outputs.web-src }}

      - name: Package WebAssembly artifact
        run: make dist-wasm RAYLIB_WEB_SRC=${{ steps.raylib.outputs.web-src }}

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solar-system-simulator-wasm
          path: |
            build/web/solar-system-simulator.js
            build/web/solar-system-simulator.wasm
            build/web/catalog-orbits.wasm
            build/web/learning-lab.mjs
            build/web/learning-lab.wasm
            build/web/build-info.json
            build/solar-system-simulator-wasm.zip

  docs:
    name: Astro docs and Pages artifact checks
    needs: [native, wasm]
    # Playwright supports 22.04. Its user-namespace policy permits managed
    # Chromium's sandbox; newer Ubuntu AppArmor policy blocked browser startup.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Only the canonical main build carries analytics. Build and validation
      # share exactly this configuration; PRs and forks remain analytics-free.
      PUBLIC_GA_ID: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'jonathanperis/solar-system-simulator' && (vars.PUBLIC_GA_ID || 'G-WPC2ZGVDD0') || '' }}
      PUBLIC_BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download WebAssembly artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: solar-system-simulator-wasm
          path: build/download-wasm

      - name: Prepare WebAssembly public assets
        run: python3 tools/prepare_wasm.py build/download-wasm docs/public/wasm

      # The simulator fetches planet/backdrop maps from the site after its
      # first frame; assets/textures/ is their single tracked source.
      - name: Copy simulator textures into the site
        run: make docs-textures

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # renovate: datasource=node-version depName=node versioning=node
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Audit docs dependencies
        working-directory: docs
        # Block on moderate or worse advisories; low-severity notices are
        # handled by the weekly grouped Renovate update instead.
        run: npm audit --audit-level=moderate

      - name: Run atlas and runtime integration tests
        working-directory: docs
        run: npm run test

      - name: Cross-check C and TypeScript catalogs
        run: |
          make headless
          node tools/check_catalog.mjs
          node tools/test_command_ids.mjs

      - name: Audit complete offline small-body inventory and orbit module
        run: |
          python3 tools/small_body_catalog.py --check
          node tools/test_catalog_wasm.mjs docs/public/wasm/catalog-orbits.wasm
          node tools/test_learning_wasm.mjs docs/public/wasm/learning-lab.mjs

      - name: Build docs site
        working-directory: docs
        run: npm run build

      - name: Type-check docs source
        working-directory: docs
        run: npm run check

      - name: Smoke-check docs routes and assets
        run: python3 tools/check_docs_routes.py docs/dist

      - name: Install pinned Chromium and system dependencies
        working-directory: docs
        run: npm exec -- playwright install --with-deps chromium

      - name: Verify isolated browser interactions against the built site
        working-directory: docs
        run: npm run test:browser

      # PR builds are analytics-free (V17), but main builds embed PUBLIC_GA_ID.
      # Rebuild PRs once with a dummy measurement ID so the analytics variant's
      # CSP, route checks and browser security test run before merge. The
      # Playwright fixture stubs Google hosts, so no real page view is sent,
      # and this throwaway dist is never uploaded (uploads are main-only).
      - name: Verify the analytics build variant (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: docs
        env:
          PUBLIC_GA_ID: G-TEST000000
        run: |
          npm run build
          python3 ../tools/check_docs_routes.py dist
          npm run test:browser -- security.spec.ts

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-evidence
          path: docs/test-results
          if-no-files-found: ignore

      - name: Upload the checked Pages tree
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solar-system-pages
          path: docs/dist
          if-no-files-found: error
