name: macOS

# The macOS job lives outside the Build workflow on purpose. Deploy Pages
# runs when Build completes successfully, so a job inside Build that waits on
# GitHub's macOS runner pool (or is cancelled while queued) would hold or skip
# the deploy of a revision whose Linux build, tests and site checks all
# passed. This check builds nothing that ships; it only adds coverage.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the older run.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REVISION: ${{ github.sha }}

jobs:
  macos:
    # Jonathan develops on macOS. This job builds the native app and runs the
    # C suite there, then renders Earth offscreen with the real GLSL 330
    # shader (CGL, no window) and checks the pixels; Linux CI only compiles
    # the shader text. Not a required check: it adds coverage, not a gate.
    name: macOS native build, tests and shader render
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RAYLIB_CFLAGS: -I/usr/local/include
      RAYLIB_LIBS: -L/usr/local/lib -lraylib -framework OpenGL -framework Cocoa -framework IOKit -framework CoreVideo -framework CoreAudio -framework CoreFoundation

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build or restore pinned raylib
        uses: ./.github/actions/raylib
        with:
          platform: native

      - name: Build simulator
        run: make clean && make

      - name: Run C test suite
        run: make test

      - name: Render with the native shader and check the pixels
        run: make test-native-shaders
